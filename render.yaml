# إعداد النشر على Render (Blueprint). يُقرأ تلقائيًا عند اختيار New → Blueprint في لوحة Render.
services:
  - type: web
    name: iqra-competition
    runtime: docker
    plan: starter            # خطة مدفوعة: لا تتوقف عند الخمول وتقبل قرصًا دائمًا
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: true         # كل تعديل يُرفع إلى GitHub يُنشر تلقائيًا
    disk:
      name: iqra-data
      mountPath: /var/data   # قاعدة البيانات والنسخ الاحتياطية وملفات المذكرات
      sizeGB: 5
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: TRUST_PROXY
        value: "1"
      - key: COOKIE_SECURE
        value: "1"
      - key: AUTO_BACKUP
        value: "1"
      - key: TIME_ZONE
        value: Asia/Riyadh
      - key: ALLOW_SIGNUP
        value: "1"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_NAME
        value: الإدارة العليا
      - key: ADMIN_PASSWORD   # يُطلب منك إدخالها عند الإنشاء؛ مؤقتة وتُغيَّر عند أول دخول
        sync: false
      - key: DEFAULT_COUNTRY_CODE
        value: "973"
      - key: DRAW_HOURS        # مهلة قرعة المقاطع بالساعات
        value: "48"
      - key: REMINDER_HOURS    # التذكير قبل موعد المرحلة
        value: "24"
      - key: MATERIAL_MAX_MB   # أقصى حجم لملف المذكرة
        value: "25"
      # قنوات الإشعار الخارجية تُضاف من لوحة Render عند ضبط المزود:
      # SMTP_HOST SMTP_PORT SMTP_SECURE SMTP_USER SMTP_PASS SMTP_FROM
      # SMS_WEBHOOK_URL SMS_WEBHOOK_TOKEN WHATSAPP_WEBHOOK_URL WHATSAPP_WEBHOOK_TOKEN
